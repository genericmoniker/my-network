# yaml-language-server: $schema=http://kylo.home:5000/api/config/schema.json
version: 0.18-0

mqtt:
  enabled: false

detectors:
  coral:
    type: edgetpu
    device: usb

# go2rtc is a separate application that is bundled with Frigate. See:
# https://github.com/AlexxIT/go2rtc
# Including the configuration here is supposed to make the live view visually
# better and enable audio.
# A user shares their successful configuration here:
# https://github.com/blakeblackshear/frigate/discussions/14888#discussioncomment-11246168
# I don't get any audio using that, nor by following audio support docs for frigate:
# https://docs.frigate.video/configuration/live/#audio-support
# go2rtc has special support for Tapo cameras
# that is supposed to include two-way audio support. See:
# https://github.com/AlexxIT/go2rtc/blob/master/internal/tapo/README.md
# I couldn't get authentication to work with any of the suggested methods,
# though.

go2rtc:
  streams:
    driveway:
      - "ffmpeg:rtsp://{FRIGATE_RTSP_USER_TAPO}:{FRIGATE_RTSP_PASS_TAPO}@192.168.4.176:554/stream1#video=copy#audio=aac"
      - "ffmpeg:driveway#audio=opus"
    driveway_detect:
      - "rtsp://{FRIGATE_RTSP_USER_TAPO}:{FRIGATE_RTSP_PASS_TAPO}@192.168.4.176:554/stream2"

    porch:
      - "ffmpeg:rtsp://{FRIGATE_RTSP_USER_TAPO}:{FRIGATE_RTSP_PASS_TAPO}@192.168.4.210:554/stream1#video=copy#audio=aac"
      - "ffmpeg:porch#audio=opus"
    porch_detect:
      - "rtsp://{FRIGATE_RTSP_USER_TAPO}:{FRIGATE_RTSP_PASS_TAPO}@192.168.4.210:554/stream2"

cameras:

  driveway:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway?video=copy&audio=aac
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/driveway_detect
          input_args: preset-rtsp-restream
          roles:
            - detect
      output_args:
        record: preset-record-generic-audio-copy

  porch:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/porch?video=copy&audio=aac
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/porch_detect
          input_args: preset-rtsp-restream
          roles:
            - detect
      output_args:
        record: preset-record-generic-audio-copy

record:
  enabled: true
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30
  continuous:
    days: 0
  motion:
    days: 3

detect:
  enabled: true
objects:
  track:
    - person
    - car
    - dog
    - motorcycle
    - bicycle
